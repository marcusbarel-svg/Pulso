<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PULSO — Sistema de auto-lectura</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
:root{
  --negro:#09080A;
  --crema:#F2EDE4;
  --oro:#C4913A;
  --oro-bajo:rgba(196,145,58,0.15);
  --muted:rgba(242,237,228,0.45);
  --borde:rgba(242,237,228,0.1);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--negro);color:var(--crema);line-height:1.6;font-size:15px;overflow-x:hidden}

/* ── ANIMACIONES ── */
@keyframes pulsar{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(1.25);opacity:.35}}
@keyframes parpadeo{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes barraDer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade-up{animation:fadeUp .65s ease both}
.fade-in{animation:fadeIn .5s ease both}
.d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.36s}
.d4{animation-delay:.5s}.d5{animation-delay:.64s}.d6{animation-delay:.78s}

/* ── BIENVENIDA ── */
.bienvenida{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:4rem 2rem;text-align:center;position:relative;overflow:hidden;
}
.pulso-aura{
  position:absolute;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(196,145,58,.22) 0%,transparent 70%);
  animation:pulsar 4s ease-in-out infinite;pointer-events:none;
}
.pulso-titulo{
  font-family:var(--serif);font-size:clamp(4rem,12vw,7rem);
  font-weight:400;letter-spacing:.18em;color:var(--crema);
  line-height:1;position:relative;
}
.pulso-punto{color:var(--oro)}
.pulso-sub{
  font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;
  color:var(--oro);margin-bottom:3rem;font-weight:500;
}
.filosofia{
  font-size:clamp(.9rem,2.5vw,1.05rem);color:var(--muted);
  max-width:520px;line-height:1.85;margin-bottom:3rem;
}
.filosofia em{color:rgba(242,237,228,.8);font-style:italic;font-family:var(--serif)}
.filosofia strong{color:var(--oro);font-family:var(--serif);font-style:italic;font-weight:400}
.frec-lista{display:flex;flex-direction:column;gap:.5rem;margin-bottom:3rem}
.frec-item{display:flex;align-items:center;gap:.75rem;justify-content:center}
.frec-rom{font-size:.7rem;letter-spacing:.15em;font-weight:500;width:22px;text-align:right}
.frec-nombre{font-size:.88rem;color:rgba(242,237,228,.38);letter-spacing:.03em}
.btn-iniciar{
  background:transparent;border:.5px solid rgba(196,145,58,.45);
  color:var(--oro);padding:.9rem 2.75rem;font-family:var(--sans);
  font-size:.85rem;letter-spacing:.12em;cursor:pointer;
  transition:all .2s;font-weight:500;
}
.btn-iniciar:hover{background:rgba(196,145,58,.08);border-color:var(--oro)}
.nota-inicio{font-size:.72rem;color:rgba(242,237,228,.18);margin-top:1rem;letter-spacing:.06em}

/* ── FRECUENCIA ── */
.frec-screen{min-height:100vh;display:flex;flex-direction:column}
.frec-header{padding:1.75rem 2rem 0;position:relative;overflow:hidden;flex-shrink:0}
.frec-rom-bg{
  position:absolute;right:1.5rem;top:-.5rem;
  font-family:var(--serif);font-size:8rem;color:rgba(255,255,255,.03);
  font-weight:400;line-height:1;user-select:none;pointer-events:none;
}
.frec-meta{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.frec-label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.frec-sep{height:.5px;width:20px;opacity:.4}
.frec-pos{font-size:.65rem;color:rgba(242,237,228,.2);letter-spacing:.1em}
.frec-titulo{font-family:var(--serif);font-size:1.7rem;font-weight:400;color:var(--crema);line-height:1.2;margin-bottom:.4rem}
.frec-tagline{font-size:.78rem;font-weight:500;letter-spacing:.05em;margin-bottom:1rem}
.frec-intro{font-size:.875rem;color:rgba(242,237,228,.42);line-height:1.75;max-width:500px;margin-bottom:0;font-style:italic}
.frec-cuerpo{padding:1.5rem 2rem 2rem;flex:1;display:flex;flex-direction:column;gap:1.25rem}
.pregunta-bloque{border-top:.5px solid rgba(242,237,228,.06);padding-top:1.25rem}
.pregunta-bloque:first-child{border-top:none;padding-top:.25rem}
.pregunta-p{font-size:.9rem;font-weight:400;color:rgba(242,237,228,.88);line-height:1.6;margin-bottom:.35rem}
.pregunta-pista{font-size:.76rem;color:rgba(242,237,228,.28);line-height:1.55;margin-bottom:.55rem;font-style:italic}
textarea{
  width:100%;min-height:78px;padding:10px 12px;
  background:rgba(255,255,255,.03);
  border:.5px solid rgba(242,237,228,.08);
  color:rgba(242,237,228,.82);font-size:.875rem;
  font-family:var(--sans);line-height:1.65;resize:vertical;
  transition:border-color .2s;
}
textarea:focus{outline:none;border-color:rgba(196,145,58,.45)}
textarea::placeholder{color:rgba(242,237,228,.18)}
.frec-footer{padding:0 2rem 2rem;display:flex;justify-content:flex-end;flex-shrink:0}
.btn-next{
  padding:.8rem 2rem;font-family:var(--sans);font-size:.85rem;
  font-weight:500;cursor:pointer;border:none;letter-spacing:.08em;
  display:flex;align-items:center;gap:.5rem;transition:all .2s;
}
.btn-next.activo:hover{opacity:.88;transform:translateX(2px)}

/* ── SÍNTESIS ── */
.sintesis{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;
}
.sintesis-aura{
  width:64px;height:64px;border-radius:50%;
  border:.5px solid rgba(196,145,58,.35);
  display:flex;align-items:center;justify-content:center;
  position:relative;margin-bottom:2rem;
}
.sintesis-dot{width:9px;height:9px;border-radius:50%;background:var(--oro);animation:parpadeo 1.4s ease-in-out infinite}
.sintesis-ring{
  position:absolute;width:64px;height:64px;border-radius:50%;
  background:rgba(196,145,58,.08);animation:pulsar 2.2s ease-in-out infinite;
}
.sintesis-titulo{font-family:var(--serif);font-size:1.4rem;color:var(--crema);font-weight:400;margin-bottom:.75rem}
.sintesis-msg{font-size:.85rem;color:rgba(196,145,58,.65);min-height:22px;transition:opacity .3s;font-style:italic}

/* ── RESULTADO ── */
.resultado{background:#F7F3EC;color:#1A1610;min-height:100vh}
.res-header{
  background:var(--negro);padding:1.25rem 2rem;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:.5px solid rgba(196,145,58,.2);
}
.res-logo{font-family:var(--serif);font-size:1.4rem;letter-spacing:.15em;color:var(--crema)}
.res-logo span{color:var(--oro)}
.btn-reset{
  background:none;border:.5px solid rgba(242,237,228,.15);
  color:rgba(242,237,228,.35);padding:.35rem .875rem;
  font-family:var(--sans);font-size:.72rem;cursor:pointer;
  letter-spacing:.08em;transition:all .2s;
}
.btn-reset:hover{border-color:rgba(242,237,228,.35);color:rgba(242,237,228,.6)}
.res-cuerpo{padding:2rem 1.75rem;max-width:720px;margin:0 auto}
.res-bloque{margin-bottom:2rem}
.res-etiqueta{
  font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  font-weight:500;color:#8B7355;margin-bottom:.75rem;
  display:flex;align-items:center;gap:.75rem;
}
.res-etiqueta::after{content:'';flex:1;height:.5px;background:#DDD8CE}
.lectura-texto{
  font-family:var(--serif);font-size:1.05rem;font-style:italic;
  color:#1A1610;line-height:1.8;
}
.firma-box{
  background:var(--negro);padding:1.5rem 1.75rem;margin-bottom:.5rem;
  position:relative;overflow:hidden;
}
.firma-box::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--oro);
}
.firma-etiqueta{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);font-weight:500;margin-bottom:.6rem}
.firma-texto{font-family:var(--serif);font-size:1.15rem;color:var(--crema);line-height:1.6;font-weight:400}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.875rem;margin-bottom:.5rem}
.mini-box{padding:1rem 1.25rem;border-radius:1px}
.mini-box-label{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;font-weight:500;margin-bottom:.5rem}
.mini-box-texto{font-size:.83rem;line-height:1.65;color:inherit;opacity:.85}
.umbral-card{padding:1.1rem 1.25rem;margin-bottom:.625rem;border-radius:1px}
.umbral-nombre{font-family:var(--serif);font-size:1rem;font-weight:500;margin-bottom:.4rem}
.umbral-desc{font-size:.83rem;line-height:1.65;opacity:.82;margin-bottom:.65rem}
.umbral-paso{
  display:flex;align-items:flex-start;gap:.4rem;
  border-top:.5px solid currentColor;padding-top:.55rem;opacity:.6;
}
.umbral-flecha{font-size:.875rem;flex-shrink:0;margin-top:1px}
.umbral-paso-texto{font-size:.8rem;font-weight:500;line-height:1.4}
.paso-box{
  border:.5px solid var(--oro);padding:1rem 1.25rem;margin-bottom:.5rem;
}
.paso-label{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:#8B7355;font-weight:500;margin-bottom:.5rem}
.paso-texto{font-family:var(--serif);font-size:.95rem;font-style:italic;color:#1A1610;line-height:1.65}
.cta-premium{background:var(--negro);padding:1.5rem 1.75rem;text-align:center;margin-top:2rem}
.cta-titulo{font-family:var(--serif);font-size:1rem;color:var(--crema);margin-bottom:.5rem}
.cta-sub{font-size:.8rem;color:rgba(242,237,228,.38);margin-bottom:1.1rem;line-height:1.6}
.btn-premium{
  background:var(--oro);color:var(--negro);border:none;
  padding:.75rem 2.25rem;font-family:var(--sans);font-size:.82rem;
  font-weight:600;cursor:pointer;letter-spacing:.1em;transition:opacity .2s;
}
.btn-premium:hover{opacity:.88}
.barra-progreso{
  height:2px;background:rgba(242,237,228,.06);
  position:fixed;top:0;left:0;right:0;z-index:100;
}
.barra-fill{height:100%;background:var(--oro);transition:width .5s ease;transform-origin:left}

@media(max-width:600px){
  .grid-2{grid-template-columns:1fr}
  .frec-header,.frec-cuerpo,.frec-footer{padding-left:1.25rem;padding-right:1.25rem}
  .res-cuerpo{padding:1.5rem 1.25rem}
  .res-header{padding:1rem 1.25rem}
}
</style>
</head>
<body>
<div id="barra-progreso" class="barra-progreso" style="display:none">
  <div id="barra-fill" class="barra-fill" style="width:0%"></div>
</div>
<div id="app"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect}=React;

const FRECUENCIAS=[
  {
    key:"herida",rom:"I",
    nombre:"La herida que enseña",
    tagline:"Lo que más te costó es la pista más importante",
    color:"#B03A2E",bg:"#130707",light:"#FAF0EE",textOscuro:"#2A0808",
    intro:"El dolor no procesado bloquea. El dolor entendido, enseña. Empezamos aquí — por lo que más te ha costado — porque ahí siempre está la señal más clara.",
    preguntas:[
      {p:"¿Qué dificultad o dolor de tu historia te dio una comprensión que la mayoría de personas no tiene?",pista:"No tienes que haberlo superado del todo. Solo necesitas reconocer que te cambió."},
      {p:"¿Qué 'defecto' o 'problema' tuyo funciona en realidad como una capacidad mal etiquetada?",pista:"La sensibilidad extrema, la obsesión, la dificultad para encajar — ¿qué pasa si eso no es un problema?"},
      {p:"¿Hay algo que sufriste que ahora te hace capaz de ver o sentir algo que otros simplemente no pueden?",pista:"Piensa en momentos donde tu experiencia fue una ventaja inesperada, aunque en su momento dolió."}
    ]
  },
  {
    key:"iman",rom:"II",
    nombre:"El imán",
    tagline:"Lo que llega a ti sin que lo busques",
    color:"#1A6B9A",bg:"#050C14",light:"#E8F3FA",textOscuro:"#061420",
    intro:"Tienes un campo de atracción invisible. Ciertas personas, problemas y conversaciones llegan a ti sin buscarlas. Eso no es azar — es la segunda frecuencia de tu señal.",
    preguntas:[
      {p:"¿Qué tipo de personas o problemas llegan a ti sin que hayas dicho que eres experto?",pista:"¿Quién te busca? ¿Con qué situaciones aterrizan en tu puerta sin que los hayas invitado?"},
      {p:"¿Para qué te consultan, incluso cuando no lo ofreces?",pista:"Conversaciones espontáneas donde alguien buscó tu perspectiva sin pedirte permiso."},
      {p:"¿Qué haces con naturalidad que ves que a otros les cuesta un esfuerzo real?",pista:"A menudo desvalorizamos nuestros dones porque para nosotros son fáciles. Exactamente ahí está la pista."}
    ]
  },
  {
    key:"fuego",rom:"III",
    nombre:"El fuego que no pides",
    tagline:"Lo que te indigna revela lo que debes hacer",
    color:"#C06020",bg:"#140800",light:"#FDF3E8",textOscuro:"#1A0800",
    intro:"La rabia y el dolor ante el mundo no son emociones a gestionar — son señales precisas. Lo que te indigna revela lo que valoras. Lo que te rompe el corazón apunta a dónde podrías vivir.",
    preguntas:[
      {p:"¿Qué en el mundo te produce una rabia o tristeza que no puedes ignorar?",pista:"No el enojo cotidiano — algo más profundo. Algo que, cuando lo ves, sientes que está fundamentalmente mal."},
      {p:"¿Cuál es el problema donde siempre piensas 'alguien debería hacer algo al respecto'?",pista:"Ese 'alguien' puede ser tú. Si llevas años pensándolo, probablemente lo es."},
      {p:"¿Cuándo fue la última vez que actuaste sin que te lo pidieran, solo porque tenía que hacerse?",pista:"¿Qué hizo esa acción inevitable para ti específicamente?"}
    ]
  },
  {
    key:"luz",rom:"IV",
    nombre:"La forma de tu luz",
    tagline:"No qué haces — cómo lo haces",
    color:"#1A7A4A",bg:"#040F07",light:"#EBF5EE",textOscuro:"#041209",
    intro:"Tu contribución no es solo QUÉ haces — es CÓMO lo haces. Tu método natural de impacto es tan único como tu huella dactilar. Esta es la frecuencia más difícil de ver porque es la más tuya.",
    preguntas:[
      {p:"¿Cómo cambia un espacio, una conversación o una situación cuando estás en ella?",pista:"¿Qué dice la gente después de pasar tiempo contigo? ¿Qué notan que se transformó?"},
      {p:"¿Cuál es tu manera natural de resolver problemas o de acompañar a otros?",pista:"¿Analizas? ¿Preguntas hasta el fondo? ¿Creas? ¿Conectas? ¿Simplificas lo complejo? ¿Sostienes el espacio?"},
      {p:"¿Qué dejan las personas contigo que no dejan con otros?",pista:"¿Qué tipo de confesiones, miedos o vulnerabilidades te traen a ti específicamente?"}
    ]
  }
];

const UMBRAL_ESTILOS=[
  {bg:"#FAF0EE",color:"#B03A2E",textOscuro:"#2A0808"},
  {bg:"#E8F3FA",color:"#1A6B9A",textOscuro:"#061420"},
  {bg:"#EBF5EE",color:"#1A7A4A",textOscuro:"#041209"},
];

async function leerPulso(ans){
  const prompt=`Eres un lector de señales — alguien capaz de detectar el patrón que corre a través de toda la vida de una persona y nombrarlo con precisión. No eres un coach motivacional. No das frases de aliento. Das lecturas específicas, honestas y a veces incómodas, como un buen novelista que lee un personaje.

Una persona completó PULSO, un proceso de auto-lectura de 4 frecuencias. Sus respuestas:

FRECUENCIA I — LA HERIDA QUE ENSEÑA:
• "${ans.herida_0||''}"
• "${ans.herida_1||''}"
• "${ans.herida_2||''}"

FRECUENCIA II — EL IMÁN:
• "${ans.iman_0||''}"
• "${ans.iman_1||''}"
• "${ans.iman_2||''}"

FRECUENCIA III — EL FUEGO QUE NO PIDES:
• "${ans.fuego_0||''}"
• "${ans.fuego_1||''}"
• "${ans.fuego_2||''}"

FRECUENCIA IV — LA FORMA DE TU LUZ:
• "${ans.luz_0||''}"
• "${ans.luz_1||''}"
• "${ans.luz_2||''}"

Produce la lectura de PULSO. SOLO JSON válido — sin markdown, sin texto antes ni después:
{"lectura":"2-3 oraciones que nombran el patrón que recorre TODAS las frecuencias. No es aliento. Es una observación precisa de quién es esta persona. Específico. Sorprendente. Verdadero. Tutea a la persona.","firma":"UNA oración que captura la forma específica de su contribución al mundo. Usa un verbo de acción inusual y preciso — NUNCA 'ayudar', 'acompañar' o 'guiar' como verbo principal. Estructura: lo que hacen + con quién específico + produciendo qué transformación específica. Que se sienta tallada exactamente para ellos.","arco":"El arco narrativo de su vida leído como una historia coherente que apunta hacia su Firma. 2 oraciones. Que suene como escuchar tu propia historia por primera vez, contada por alguien que la ve más claro que tú.","interferencia":"La única cosa principal entre ellos y su Firma — extraída específicamente de sus respuestas, no genérica. 1-2 oraciones. Honesta, no condescendiente.","umbrales":[{"nombre":"3-4 palabras específicas y poéticas que nombran este umbral","descripcion":"2-3 oraciones concretas basadas en sus respuestas reales. Nada genérico.","primer_paso":"Una acción específica y honesta para los próximos 7 días. No 'reflexiona sobre' ni 'considera'. Una acción real."},{"nombre":"...","descripcion":"...","primer_paso":"..."},{"nombre":"...","descripcion":"...","primer_paso":"..."}],"paso_honesto":"El único próximo paso genuinamente honesto — no el cómodo, sino el que sus respuestas señalan inevitablemente. 1 oración directa y específica."}`;

  const res=await fetch("/api/claude",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1300,messages:[{role:"user",content:prompt}]})
  });
  const data=await res.json();
if(!data || !data.content) throw new Error('Sin respuesta');
const text=data.content.map(b=>b.text||"").join("");
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

// ── PANTALLAS ──────────────────────────────────────────────────

function Bienvenida({onStart}){
  return(
    <div className="bienvenida">
      <div className="pulso-aura"/>
      <div style={{position:"relative",zIndex:1}}>
        <p className="pulso-titulo fade-up d1">PULSO<span className="pulso-punto">.</span></p>
        <p className="pulso-sub fade-up d2">Sistema de auto-lectura</p>
        <p className="filosofia fade-up d3">
          La mayoría de los sistemas te piden que <em>encuentres</em> tu propósito.<br/>
          PULSO parte de una premisa diferente:<br/>
          <strong>ya lo tienes.</strong><br/>
          Lleva años emitiéndolo — en lo que te duele, en lo que atrae a otros hacia ti,<br/>
          en lo que no puedes ignorar, y en cómo transformas todo lo que tocas.<br/>
          Este proceso no lo crea. Lo lee.
        </p>
        <div className="frec-lista fade-up d4">
          {FRECUENCIAS.map((f,i)=>(
            <div className="frec-item" key={i}>
              <span className="frec-rom" style={{color:f.color}}>{f.rom}</span>
              <span className="frec-nombre">{f.nombre}</span>
            </div>
          ))}
        </div>
        <button className="btn-iniciar fade-up d5" onClick={onStart}>INICIAR LA LECTURA</button>
        <p className="nota-inicio fade-up d6">~15 minutos · Sin registro · Completamente personal</p>
      </div>
    </div>
  );
}

function FrecuenciaScreen({fi,answers,setAnswer,onNext,isLast}){
  const f=FRECUENCIAS[fi];
  const llena=f.preguntas.some((_,i)=>answers[`${f.key}_${i}`]?.trim());
  const progreso=((fi+1)/FRECUENCIAS.length)*100;

  useEffect(()=>{
    const barra=document.getElementById("barra-progreso");
    const fill=document.getElementById("barra-fill");
    if(barra&&fill){barra.style.display="block";fill.style.width=progreso+"%";fill.style.background=f.color;}
  },[fi]);

  return(
    <div className="frec-screen fade-in" style={{background:f.bg}}>
      <div className="frec-header">
        <div className="frec-rom-bg">{f.rom}</div>
        <div className="frec-meta">
          <span className="frec-label" style={{color:f.color}}>Frecuencia {f.rom}</span>
          <div className="frec-sep" style={{background:f.color}}/>
          <span className="frec-pos">{fi+1} de 4</span>
        </div>
        <h2 className="frec-titulo">{f.nombre}</h2>
        <p className="frec-tagline" style={{color:f.color}}>{f.tagline}</p>
        <p className="frec-intro">{f.intro}</p>
      </div>

      <div className="frec-cuerpo">
        {f.preguntas.map((preg,i)=>(
          <div className="pregunta-bloque" key={i}>
            <p className="pregunta-p">{preg.p}</p>
            <p className="pregunta-pista">{preg.pista}</p>
            <textarea
              value={answers[`${f.key}_${i}`]||""}
              onChange={e=>setAnswer(`${f.key}_${i}`,e.target.value)}
              placeholder="Escribe libremente..."
            />
          </div>
        ))}
      </div>

      <div className="frec-footer">
        <button
          className={`btn-next${llena?" activo":""}`}
          onClick={llena?onNext:undefined}
          style={{
            background:llena?f.color:"rgba(255,255,255,.06)",
            color:llena?"#0A0909":"rgba(242,237,228,.2)",
            cursor:llena?"pointer":"not-allowed",
          }}
        >
          {isLast?"LEER MI SEÑAL ↗":"SIGUIENTE FRECUENCIA →"}
        </button>
      </div>
    </div>
  );
}

function Sintesis(){
  const msgs=["Leyendo la primera frecuencia...","Detectando el patrón del imán...","Escuchando el fuego que no pediste...","Trazando la forma de tu luz...","Escribiendo tu Firma...","Nombrando los umbrales..."];
  const[mi,setMi]=useState(0);
  useEffect(()=>{
    document.getElementById("barra-progreso").style.display="none";
    const t=setInterval(()=>setMi(m=>(m+1)%msgs.length),2400);
    return()=>clearInterval(t);
  },[]);
  return(
    <div className="sintesis">
      <div className="sintesis-aura">
        <div className="sintesis-ring"/>
        <div className="sintesis-dot"/>
      </div>
      <h2 className="sintesis-titulo">Leyendo tu señal</h2>
      <p className="sintesis-msg">{msgs[mi]}</p>
    </div>
  );
}

function Resultado({r,onReset}){
  useEffect(()=>{document.getElementById("barra-progreso").style.display="none";},[]);
  if(!r)return null;
  return(
    <div className="resultado fade-in">
      <div className="res-header">
        <span className="res-logo">PULSO<span>.</span></span>
        <button className="btn-reset" onClick={onReset}>NUEVA LECTURA</button>
      </div>
      <div className="res-cuerpo">

        {/* LA LECTURA */}
        <div className="res-bloque">
          <div className="res-etiqueta">La lectura</div>
          <p className="lectura-texto">{r.lectura}</p>
        </div>

        {/* LA FIRMA */}
        <div className="res-bloque">
          <div className="res-etiqueta">Tu Firma</div>
          <div className="firma-box">
            <div className="firma-etiqueta">Firma</div>
            <p className="firma-texto">{r.firma}</p>
          </div>
        </div>

        {/* EL ARCO + LA INTERFERENCIA */}
        <div className="res-bloque">
          <div className="res-etiqueta">El arco y la interferencia</div>
          <div className="grid-2">
            <div className="mini-box" style={{background:"#EAE4D8",color:"#2A2010"}}>
              <div className="mini-box-label" style={{color:"#8B7355"}}>El arco</div>
              <p className="mini-box-texto">{r.arco}</p>
            </div>
            <div className="mini-box" style={{background:"#FAF0EE",color:"#2A0808"}}>
              <div className="mini-box-label" style={{color:"#B03A2E"}}>La interferencia</div>
              <p className="mini-box-texto">{r.interferencia}</p>
            </div>
          </div>
        </div>

        {/* LOS UMBRALES */}
        <div className="res-bloque">
          <div className="res-etiqueta">Los tres umbrales</div>
          {(r.umbrales||[]).map((u,i)=>{
            const s=UMBRAL_ESTILOS[i%3];
            return(
              <div className="umbral-card" key={i} style={{background:s.bg,color:s.textOscuro}}>
                <h3 className="umbral-nombre">{u.nombre}</h3>
                <p className="umbral-desc">{u.descripcion}</p>
                <div className="umbral-paso" style={{borderTopColor:s.color+"40",color:s.textOscuro}}>
                  <span className="umbral-flecha" style={{color:s.color}}>→</span>
                  <p className="umbral-paso-texto">Esta semana: {u.primer_paso}</p>
                </div>
              </div>
            );
          })}
        </div>

        {/* EL PASO HONESTO */}
        <div className="res-bloque">
          <div className="res-etiqueta">El paso honesto</div>
          <div className="paso-box">
            <p className="paso-texto">{r.paso_honesto}</p>
          </div>
        </div>

        {/* CTA */}
        <div className="cta-premium">
          <p className="cta-titulo">Mantén viva tu señal</p>
          <p className="cta-sub">La Escucha semanal, el Registro Vivo y el Mapa de Señales<br/>te esperan en PULSO Premium.</p>
          <button className="btn-premium">ACTIVAR PULSO PREMIUM</button>
        </div>

      </div>
    </div>
  );
}

// ── APLICACIÓN ────────────────────────────────────────────────
function App(){
  const[pantalla,setPantalla]=useState("bienvenida");
  const[fi,setFi]=useState(0);
  const[answers,setAnswers]=useState({});
  const[result,setResult]=useState(null);

  const setAnswer=(k,v)=>setAnswers(a=>({...a,[k]:v}));

  const avanzar=async()=>{
    if(fi<FRECUENCIAS.length-1){setFi(f=>f+1);}
    else{
      setPantalla("sintesis");
      try{
        const r=await leerPulso(answers);
        setResult(r);
        setPantalla("resultado");
      }catch(e){
        console.error(e);
        setPantalla("frecuencia");
        alert("Error al leer la señal. Verifica tu conexión e intenta de nuevo.");
      }
    }
  };

  const reset=()=>{
    setPantalla("bienvenida");
    setFi(0);setAnswers({});setResult(null);
    document.getElementById("barra-fill").style.width="0%";
  };

  if(pantalla==="bienvenida") return <Bienvenida onStart={()=>setPantalla("frecuencia")}/>;
  if(pantalla==="frecuencia") return(
    <FrecuenciaScreen
      fi={fi} answers={answers} setAnswer={setAnswer}
      onNext={avanzar} isLast={fi===FRECUENCIAS.length-1}
    />
  );
  if(pantalla==="sintesis") return <Sintesis/>;
  if(pantalla==="resultado") return <Resultado r={result} onReset={reset}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
