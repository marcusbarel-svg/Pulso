<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PULSO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f0e8; color: #1a1610; font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; }
body.rtl { direction: rtl; }
.screen { display: none; flex-direction: column; min-height: 100vh; padding: 2.5rem 2rem 2rem; }
.screen.active { display: flex; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
.logo { font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: #8b7355; }
.phase { font-size: 11px; letter-spacing: 0.2em; color: #b4a898; text-transform: uppercase; }
.content { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 520px; }
.title { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; line-height: 1.1; margin-bottom: 1.5rem; color: #1a1610; }
.subtitle { font-size: 14px; line-height: 1.8; color: #8b7355; margin-bottom: 2.5rem; }
.btn { background: transparent; border: 0.5px solid #c4b8a8; color: #8b7355; font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; padding: 10px 24px; cursor: pointer; transition: all 0.25s; align-self: flex-start; }
.btn:hover { border-color: #8b7355; color: #1a1610; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 320px; margin-bottom: 2rem; }
.lang-btn { background: transparent; border: 0.5px solid #c4b8a8; color: #8b7355; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 300; padding: 14px 20px; cursor: pointer; transition: all 0.25s; text-align: left; }
.lang-btn:hover { border-color: #8b7355; color: #1a1610; background: rgba(139,115,85,0.05); }
.lang-btn .lang-name { display: block; font-size: 15px; margin-bottom: 2px; }
.lang-btn .lang-native { display: block; font-size: 11px; opacity: 0.5; letter-spacing: 0.05em; }
.messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; padding-bottom: 1rem; }
.msg { max-width: 460px; }
.msg.pulso .msg-text { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; line-height: 1.6; color: #1a1610; }
.msg.user .msg-text { font-size: 14px; line-height: 1.7; color: #8b7355; padding-left: 1rem; border-left: 0.5px solid #c4b8a8; }
body.rtl .msg.user .msg-text { padding-left: 0; padding-right: 1rem; border-left: none; border-right: 0.5px solid #c4b8a8; }
.input-area { display: flex; flex-direction: column; gap: 0.75rem; }
.input-area textarea { background: transparent; border: none; border-bottom: 0.5px solid #c4b8a8; color: #1a1610; font-family: 'DM Sans', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.7; padding: 0 0 1rem 0; resize: none; outline: none; width: 100%; min-height: 60px; caret-color: #8b7355; transition: border-color 0.3s; }
.input-area textarea::placeholder { color: #c4b8a8; }
.input-area textarea:focus { border-bottom-color: #8b7355; }
.input-row { display: flex; justify-content: flex-end; align-items: center; gap: 1rem; }
.char-hint { font-size: 11px; color: #c4b8a8; }
.pulse-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 2rem; }
.pulse { width: 48px; height: 48px; border-radius: 50%; border: 0.5px solid #c4b8a8; position: relative; animation: breathe 2.5s ease-in-out infinite; }
.pulse::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; border: 0.5px solid #b4a898; animation: breathe 2.5s ease-in-out infinite reverse; }
.pulse::after { content: ''; position: absolute; inset: 18px; border-radius: 50%; background: #c4b8a8; animation: breathe 2.5s ease-in-out infinite; }
@keyframes breathe { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.12);opacity:1} }
.error { font-size: 12px; color: #8a4a3a; margin-top: 0.5rem; }
</style>
</head>
<body>

<div id="lang-screen" class="screen active">
  <div class="header"><span class="logo">Pulso</span></div>
  <div class="content">
    <h1 class="title" style="margin-bottom:2rem;">—</h1>
    <div class="lang-grid">
      <button class="lang-btn" onclick="selectLang('es')">
        <span class="lang-name">Español</span>
        <span class="lang-native">es</span>
      </button>
      <button class="lang-btn" onclick="selectLang('en')">
        <span class="lang-name">English</span>
        <span class="lang-native">en</span>
      </button>
      <button class="lang-btn" onclick="selectLang('fr')">
        <span class="lang-name">Français</span>
        <span class="lang-native">fr</span>
      </button>
    
    </div>
  </div>
</div>

<div id="intro" class="screen">
  <div class="header">
    <span class="logo">Pulso</span>
    <button onclick="show('lang-screen')" style="background:transparent;border:none;color:#b4a898;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.2em;cursor:pointer;text-transform:uppercase;"id="lang-btn-text"id="lang-btn-intro">Idioma</button>
  </div>
  <div class="content">
    <h1 class="title" id="intro-title"></h1>
    <p class="subtitle" id="intro-subtitle"></p>
    <button class="btn" id="start-btn" onclick="startSession()"></button>
  </div>
</div>

<div id="chat" class="screen">
 <div class="header">
    <span class="logo">Pulso</span>
    <div style="display:flex;align-items:center;gap:1rem;">
      <span class="phase" id="phase-label"></span>
      <button onclick="show('lang-screen')" style="background:transparent;border:none;color:#b4a898;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.2em;cursor:pointer;text-transform:uppercase;"id="lang-btn-intro">Idioma</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <textarea id="user-input" rows="2" onkeydown="handleKey(event)"></textarea>
    <div class="input-row">
      <span class="char-hint" id="char-hint"></span>
      <button class="btn" id="export-btn" onclick="exportChat()"></button>
      <button class="btn" id="send-btn" onclick="sendMessage()"></button>
    </div>
    <div class="error" id="error-msg"></div>
  </div>
</div>

<div id="loading" class="screen">
  <div class="header"><span class="logo">Pulso</span></div>
  <div class="pulse-container">
    <div class="pulse"></div>
    <span class="phase" id="loading-text"></span>
  </div>
</div>

<script>
const TEXTS = {
  es: {
    title: 'Hay algo\nque te trajo aquí.',
    subtitle: 'Escribe lo que surge. Sin filtros. Sin estructura.\nPULSO hace el resto.',
    start: 'Comenzar',
    placeholder: 'Escribe aquí...',
    send: 'Enviar',
    save: 'Guardar',
    loading: 'Leyendo',
    error: 'Error de conexión. Intenta de nuevo.',
    initMsg: 'inicio'
  },
  en: {
    title: 'Something\nbrought you here.',
    subtitle: 'Write what comes. No filters. No structure.\nPULSO does the rest.',
    start: 'Begin',
    placeholder: 'Write here...',
    send: 'Send',
    save: 'Save',
    loading: 'Reading',
    error: 'Connection error. Try again.',
    initMsg: 'start'
  },
  fr: {
    title: 'Quelque chose\nvous a amené ici.',
    subtitle: 'Écrivez ce qui vient. Sans filtres. Sans structure.\nPULSO fait le reste.',
    start: 'Commencer',
    placeholder: 'Écrivez ici...',
    send: 'Envoyer',
    save: 'Sauvegarder',
    loading: 'Lecture',
    error: 'Erreur de connexion. Réessayez.',
    initMsg: 'début'
  },
  he: {
    title: 'משהו\nהביא אותך לכאן.',
    subtitle: 'כתוב מה שעולה. ללא מסננים. ללא מבנה.\nPULSO יעשה את השאר.',
    start: 'התחל',
    placeholder: 'כתוב כאן...',
    send: 'שלח',
    save: 'שמור',
    loading: 'קורא',
    error: 'שגיאת חיבור. נסה שוב.',
    initMsg: 'התחלה'
  }
};

let lang = 'es';
let messages = [];
let userId = localStorage.getItem('pulso_user_id') || generateId();
localStorage.setItem('pulso_user_id', userId);
let memory = null;

function generateId() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectLang(l) {
  lang = l;
  const t = TEXTS[lang];

  if (lang === 'he') {
    document.body.classList.add('rtl');
    document.documentElement.lang = 'he';
  } else {
    document.body.classList.remove('rtl');
    document.documentElement.lang = lang;
  }

  document.getElementById('intro-title').textContent = t.title;
  document.getElementById('intro-subtitle').textContent = t.subtitle;
  document.getElementById('start-btn').textContent = t.start;
  document.getElementById('user-input').placeholder = t.placeholder;
  document.getElementById('send-btn').textContent = t.send;
  document.getElementById('export-btn').textContent = t.save;
  document.getElementById('loading-text').textContent = t.loading;
  document.getElementById('lang-btn-intro').textContent = l === 'es' ? 'Idioma' : l === 'en' ? 'Language' : l === 'fr' ? 'Langue' : 'Idioma';
document.getElementById('lang-btn-chat').textContent = l === 'es' ? 'Idioma' : l === 'en' ? 'Language' : l === 'fr' ? 'Langue' : 'Idioma';

  show('intro');
}

function addMessage(role, text) {
  messages.push({ role: role === 'pulso' ? 'assistant' : 'user', content: text });
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<p class="msg-text">' + text.replace(/\n/g, '<br/>') + '</p>';
  container.appendChild(div);
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
}

function handleKey(e) {
  const input = document.getElementById('user-input');
  const len = input.value.length;
  document.getElementById('char-hint').textContent = len > 0 ? len : '';
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function startSession() {
  show('loading');
  try {
    const memRes = await fetch('/api/memory?user_id=' + userId);
    const memData = await memRes.json();
    if (memData.memory) {
      const m = memData.memory;
      memory = `
Razón inicial: ${m.razon_inicial || ''}
Lo que el usuario expresó: ${(m.frases_clave || []).join(' | ')}
Lo que PULSO observó: ${(m.sin_resolver || []).join(' | ')}
      `.trim();
    }
  } catch(e) {}

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: TEXTS[lang].initMsg }],
        memory: memory,
        lang: lang
      })
    });
    const data = await res.json();
    const text = data.content.map(b => b.text || '').join('');
    show('chat');
    addMessage('pulso', text);
  } catch(e) {
    show('intro');
    document.getElementById('error-msg').textContent = TEXTS[lang].error;
  }
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('char-hint').textContent = '';
  document.getElementById('error-msg').textContent = '';
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  show('loading');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages, memory: memory, lang: lang })
    });
    const data = await res.json();
    const reply = data.content.map(b => b.text || '').join('');
    show('chat');
    addMessage('pulso', reply);
    document.getElementById('send-btn').disabled = false;
    saveMemoryIfNeeded();
  } catch(e) {
    show('chat');
    document.getElementById('error-msg').textContent = TEXTS[lang].error;
    document.getElementById('send-btn').disabled = false;
  }
}

function saveMemoryIfNeeded() {
  if (messages.length >= 3) {
    const frases_usuario = messages
      .filter(m => m.role === 'user')
      .slice(-4)
      .map(m => m.content.substring(0, 150));

    const frases_pulso = messages
      .filter(m => m.role === 'assistant')
      .slice(-2)
      .map(m => m.content.substring(0, 150));

    const razon = messages
      .filter(m => m.role === 'user')[0]?.content?.substring(0, 300) || '';

    fetch('/api/memory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: userId,
        razon_inicial: razon,
        frases_clave: frases_usuario,
        sin_resolver: frases_pulso
      })
    }).catch(() => {});
  }
}

function exportChat() {
  if (messages.length === 0) return;
  const lines = messages.map(m => {
    const role = m.role === 'assistant' ? 'PULSO' : 'Yo';
    return role + ':\n' + m.content + '\n';
  }).join('\n');
  const fecha = new Date().toLocaleDateString();
  const blob = new Blob(['PULSO — ' + fecha + '\n\n' + lines], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pulso-' + fecha.replace(/\//g, '-') + '.txt';
  a.click();
}
</script>
</body>
</html>
